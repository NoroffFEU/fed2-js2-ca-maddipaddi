<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowlink | Register</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body>
    <header>
      <nav class="p-3 mb-3 border-bottom navbar navbar-expand-md fixed-top">
        <div class="container-fluid">
          <div class="logo-container me-3">
            <a href="/" class="link-body-emphasis text-decoration-none">
              <img src="assets/logo-light-text.png" alt="logo-light" />
            </a>
          </div>
          <button
            class="navbar-toggler collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarCollapse"
            aria-controls="navbarCollapse"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="navbar-collapse collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-3">
              <li class="nav-item">
                <a href="/" class="nav-link active">Home</a>
              </li>
              <li class="nav-item">
                <a href="/auth/login/" class="nav-link link-body-emphasis"
                  >Login</a
                >
              </li>
              <li class="nav-item">
                <a href="/auth/register/" class="nav-link link-body-emphasis"
                  >Register</a
                >
              </li>
            </ul>
            <div class="dropdown text-end me-3">
              <a
                href="#"
                class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                id="user-name"
              >
                <img
                  id="user-image"
                  src=""
                  alt="user"
                  width="32"
                  height="32"
                  class="rounded-circle"
                />
              </a>
              <ul class="dropdown-menu text-small">
                <li><a class="dropdown-item" href="/profile/">Profile</a></li>
                <li>
                  <a href="/post/create/" class="dropdown-item">Create post</a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <button id="logout" class="dropdown-item">Logout</button>
                </li>
              </ul>
            </div>
            <form class="d-flex ms-3" role="search">
              <input
                type="search"
                class="form-control"
                placeholder="Search..."
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <div id="loading-spinner" class="spinner"></div>
    <h1>Register</h1>
    <div id="register-page-content">
      <form name="register">
        <div>
          <label for="name">Name</label>
          <input
            id="name"
            type="text"
            name="name"
            required
            maxlength="20"
            pattern="^[\w]+$"
            title="Please enter a username using only letters and numbers"
          />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            required
            pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
            title="Please enter a valid noroff.no or stud.noroff.no address"
          />
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            minlength="8"
          />
        </div>

        <a href="/auth/login/">Login</a>
        <button class="button">Register</button>
      </form>
    </div>
  </body>
</html>
