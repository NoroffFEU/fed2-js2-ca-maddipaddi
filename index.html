<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <div id="loading-spinner" class="spinner"></div>
    <header class="py-3 mb-3 border-bottom">
      <div
        class="container-fluid d-grid gap-3 align-items-center"
        style="grid-template-columns: 1fr 2fr"
      >
        <a
          href="/"
          class="d-flex align-items-center col-lg-4 mb-2 mb-lg-0 link-body-emphasis text-decoration-none"
        >
          <img src="assets/logo-light-text.png" alt="logo-light" />
        </a>
        <div class="d-flex align-items-center">
          <form class="w-100 me-3" role="search">
            <input
              type="search"
              class="form-control"
              placeholder="Search..."
              aria-label="Search"
            />
          </form>
        </div>
      </div>
    </header>
    <main>
      <div class="container me-0">
        <div class="row row-cols-2 flex-row-reverse">
          <div class="col-4">
            <ul class="nav nav-pills flex-column">
              <li class="nav-item">
                <a href="/" class="nav-link active">Home</a>
              </li>
              <li class="nav-item">
                <a href="/profile/" class="nav-link link-body-emphasis"
                  >My Profile</a
                >
              </li>
              <li class="nav-item">
                <a href="/auth/login/" class="nav-link link-body-emphasis"
                  >Login</a
                >
              </li>
              <li class="nav-item">
                <a href="/auth/register/" class="nav-link link-body-emphasis"
                  >Register</a
                >
              </li>
              <li class="nav-item">
                <a href="/post/create/" class="nav-link link-body-emphasis"
                  >Create post</a
                >
              </li>
            </ul>
            <button id="logout" class="btn btn-light-theme">Logout</button>
          </div>

          <div id="posts-container" class="col-8"></div>
        </div>
      </div>
    </main>
  </body>
</html>
