<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowlink | Home</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
          <div class="logo-container me-3">
            <a href="/" class="link-body-emphasis text-decoration-none">
              <img
                id="logo"
                src="/assets/logo-light-text.png"
                alt="logo-light"
              />
            </a>
          </div>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasNavbar"
            aria-controls="offcanvasNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="offcanvasNavbar"
            aria-labelledby="offcanvasNavbarLabel"
          >
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Explore</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              ></button>
            </div>
            <div class="offcanvas-body">
              <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item">
                  <a href="/" class="nav-link link-body-emphasis active fs-5"
                    >Home</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    href="/auth/login/"
                    class="nav-link link-body-emphasis fs-5"
                    >Login</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    href="/auth/register/"
                    class="nav-link link-body-emphasis fs-5"
                    >Register</a
                  >
                </li>
                <li class="nav-item dropdown fs-5">
                  <a
                    href="#"
                    class="nav-link link-body-emphasis dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    id="user-name"
                  >
                    <img
                      id="user-image"
                      src=""
                      alt="user"
                      width="32"
                      height="32"
                      class="rounded-circle"
                    />
                  </a>
                  <ul class="dropdown-menu text-small">
                    <li>
                      <a class="dropdown-item" href="/profile/">Profile</a>
                    </li>
                    <li>
                      <a href="/post/create/" class="dropdown-item"
                        >Create post</a
                      >
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                      <button id="logout" class="dropdown-item">Logout</button>
                    </li>
                  </ul>
                </li>
              </ul>
              <form class="d-flex mt-3 mt-lg-0 me-3" role="search">
                <input
                  type="search"
                  class="form-control me-2"
                  placeholder="Search..."
                  aria-label="Search"
                />
                <button class="btn btn-outline-primary" type="submit">
                  Search
                </button>
              </form>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="mt-5 pt-5">
      <div class="container">
        <div class="row justify-content-center">
          <div
            id="posts-container"
            class="col-12 col-md-10 col-lg-7 postfeed p-5"
          >
            <div id="loading-spinner" class="spinner"></div>
          </div>
        </div>
      </div>
      <div
        class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle"
      >
        <div class="form-check form-switch">
          <input
            type="checkbox"
            class="btn-check"
            id="themeToggle"
            autocomplete="off"
          />
          <label id="themeToggleLabel" class="btn btn-primary" for="themeToggle"
            >Night</label
          >
        </div>
      </div>
    </main>
  </body>
</html>
